<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="sign.css">
    <link rel="stylesheet" href="query.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>

    <div class="signup-container">
        

    
            <div class="signUp">
                <p>Sign up with <span>google</span> <i class="fa-brands fa-google"></i></p>
            <label for="Name">Name :</label>
            <input type="text" name="Name" id="Name" placeholder="Enter your Name"><br><br>
            <label for="Surname">Surname :</label>
            <input type="text" name="text" id="Surname" placeholder="Enter your Surname"><br><br>
            <label for="Password">New Password :</label>
            <input type="password" name="Password id="Password" placeholder="Enter Password" max="10" minlength="4"><br><br>
            <label for="Password">Confrim Password :</label>
            <input type="password" name="Password id="Password" placeholder="Confrim Password" max="10" minlength="4"><br><br>
            <label for="email">Email :</label>
            <input type="email" name="Email" id="Email" placeholder="Enter your Email"><br><br>
            <label for="Cellphone">CellPhone :</label>
            <input type="number" name="CellPhone" id="CellPhone" placeholder="Enter your Phone Number"><br><br>
         <textarea name="Address" id="Address" placeholder="Enter your Address" maxlength="100"></textarea><br><br>
         <input type="submit" id="submit">
         <button><a href="/index.html">Back</a></button>
          </div>
    </div>

    
</body>
